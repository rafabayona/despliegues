name: CI Validar y Testear

on:
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar HTML (html-validate)
        run: npx html-validate prac1cicd/index.html

      - name: Linting CSS (stylelint)
        run: npx stylelint "prac1cicd/css/**/*.css"

      - name: Linting JavaScript (eslint)
        run: npx eslint prac1cicd/js/

      - name: Ejecutar tests unitarios
        run: npm test